<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Field Tech Copilot</title>
  <desc id="desc">Offline-first diagnostic casework for Windows repair technicians, with local AI, case memory, local retrieval, and safety guards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06150f"/>
      <stop offset="0.58" stop-color="#0b2c21"/>
      <stop offset="1" stop-color="#123d2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff5f"/>
      <stop offset="1" stop-color="#70f0aa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf7"/>
      <stop offset="1" stop-color="#eaf1ec"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#b9ddca" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="36" fill="url(#background)"/>
  <rect width="1600" height="760" rx="36" fill="url(#grid)"/>
  <circle cx="1310" cy="125" r="220" fill="#d8ff5f" fill-opacity="0.09" filter="url(#glow)"/>
  <circle cx="220" cy="685" r="180" fill="#70f0aa" fill-opacity="0.06" filter="url(#glow)"/>

  <g transform="translate(86 76)">
    <rect width="334" height="42" rx="21" fill="#d8ff5f" fill-opacity="0.12" stroke="#d8ff5f" stroke-opacity="0.34"/>
    <circle cx="25" cy="21" r="6" fill="#d8ff5f"/>
    <text x="44" y="27" fill="#d8ff5f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">OFFLINE-FIRST • LOCAL AI</text>

    <text x="0" y="173" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="96" font-weight="850" letter-spacing="-4">FIELD TECH</text>
    <text x="0" y="267" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="108" font-weight="900" letter-spacing="-5">COPILOT</text>

    <text x="4" y="324" fill="#c7d8ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">Diagnostic casework for Windows repair technicians.</text>
    <text x="4" y="362" fill="#8eb3a0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Preserve the evidence. Ground the reasoning. Guard every next step.</text>

    <g transform="translate(0 420)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">
      <rect width="170" height="48" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="27" cy="24" r="8" fill="#70f0aa"/>
      <text x="46" y="30" fill="#eef8f1">CASE MEMORY</text>

      <g transform="translate(186)">
        <rect width="154" height="48" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <path d="M22 20h14M22 25h14M22 30h9" stroke="#d8ff5f" stroke-width="3" stroke-linecap="round"/>
        <text x="48" y="30" fill="#eef8f1">LOCAL RAG</text>
      </g>

      <g transform="translate(356)">
        <rect width="184" height="48" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <path d="M27 15l9 4v7c0 7-4 11-9 14-5-3-9-7-9-14v-7z" fill="none" stroke="#70f0aa" stroke-width="2.5"/>
        <path d="M23 27l3 3 6-7" fill="none" stroke="#d8ff5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="30" fill="#eef8f1">SAFETY GUARDS</text>
      </g>
    </g>

    <g transform="translate(4 520)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <path d="M0 13h540" stroke="#90b6a2" stroke-opacity="0.25"/>
      <text x="0" y="52" fill="#8eb3a0" font-size="16" letter-spacing="1.1">OLLAMA  •  LLAMA.CPP  •  LM STUDIO  •  SQLITE FTS5</text>
      <text x="0" y="86" fill="#d8ff5f" font-size="16" font-weight="700">ONE GUARDED STEP AT A TIME →</text>
    </g>
  </g>

  <g transform="translate(760 82)" filter="url(#shadow)">
    <rect width="754" height="586" rx="30" fill="#071710" stroke="#4f7862" stroke-width="2"/>
    <rect x="18" y="18" width="718" height="550" rx="20" fill="url(#screen)"/>

    <rect x="18" y="18" width="718" height="68" rx="20" fill="#0b2c21"/>
    <path d="M18 66h718v20H18z" fill="#0b2c21"/>
    <rect x="42" y="37" width="34" height="34" rx="10" fill="url(#accent)"/>
    <text x="51" y="60" fill="#071710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="900">FT</text>
    <text x="92" y="59" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">Field Tech Copilot</text>
    <rect x="576" y="37" width="132" height="32" rx="16" fill="#174c39"/>
    <circle cx="596" cy="53" r="5" fill="#70f0aa"/>
    <text x="609" y="58" fill="#d8ede1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">OFFLINE READY</text>

    <rect x="42" y="112" width="178" height="426" rx="16" fill="#e5ece7"/>
    <text x="62" y="144" fill="#567064" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">ACTIVE CASE</text>
    <rect x="58" y="162" width="146" height="74" rx="12" fill="#ffffff" stroke="#cbd8cf"/>
    <circle cx="75" cy="185" r="5" fill="#28a66f"/>
    <text x="88" y="190" fill="#15211b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">Wi-Fi drops</text>
    <text x="74" y="213" fill="#6d7c74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Evidence saved locally</text>
    <text x="62" y="276" fill="#567064" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">CASE STATE</text>
    <g fill="#b6c7bd">
      <rect x="62" y="296" width="114" height="8" rx="4"/>
      <rect x="62" y="318" width="92" height="8" rx="4"/>
      <rect x="62" y="340" width="126" height="8" rx="4"/>
      <rect x="62" y="362" width="77" height="8" rx="4"/>
    </g>
    <rect x="58" y="474" width="146" height="42" rx="11" fill="#167653"/>
    <text x="88" y="501" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">+ NEW CASE</text>

    <text x="248" y="134" fill="#167653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850" letter-spacing="1.8">CURRENT ASSESSMENT</text>
    <text x="248" y="166" fill="#17231d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Network path not yet localized</text>
    <text x="248" y="193" fill="#65766d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Evidence favors scoping before configuration changes.</text>

    <rect x="248" y="222" width="454" height="190" rx="18" fill="#ffffff" stroke="#cdd9d1"/>
    <rect x="248" y="222" width="454" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="270" y="258" fill="#167653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850" letter-spacing="1.6">NEXT BEST TEST</text>
    <rect x="628" y="243" width="52" height="24" rx="12" fill="#dff2e8"/>
    <text x="641" y="260" fill="#167653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="850">SAFE</text>
    <text x="270" y="293" fill="#17231d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">Compare a known-good connection</text>
    <text x="270" y="323" fill="#53655b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">1. Keep the current configuration unchanged.</text>
    <text x="270" y="348" fill="#53655b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">2. Test the same destination from a known-good device.</text>
    <text x="270" y="373" fill="#53655b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">3. Record which combinations work and fail.</text>

    <rect x="248" y="432" width="280" height="86" rx="16" fill="#eef4f0" stroke="#d2ded6"/>
    <text x="268" y="460" fill="#167653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="850" letter-spacing="1.4">LOCAL SOURCE</text>
    <text x="268" y="485" fill="#1c4f75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">Windows connectivity scoping</text>
    <text x="268" y="505" fill="#718078" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Reviewed procedure • cited locally</text>

    <rect x="546" y="432" width="156" height="86" rx="16" fill="#0b2c21"/>
    <text x="566" y="460" fill="#94b7a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">AUDIT TRAIL</text>
    <path d="M569 482l9 9 18-21" fill="none" stroke="#d8ff5f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="609" y="490" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">Saved</text>
  </g>

  <g transform="translate(1450 674)">
    <circle cx="0" cy="0" r="42" fill="url(#accent)"/>
    <path d="M-17 1l11 11 24-28" fill="none" stroke="#082117" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
